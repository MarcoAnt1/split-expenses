<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Split Expenses</h1>
        <p id="status-message">Javascript is not connected yet.</p>

        <section class="card">
            <h2>People</h2>
            <p class="hint">Add 2 to 6 people.</p>

            <form id="person-form">
                <label for="person-name">Name</label>
                <div class="form-row">
                    <input type="text" id="person-name" maxlength="20" autocomplete="off">
                    <button type="submit">Add</button>
                </div>
            </form>

            <p id="person-error" class="error" role="alert"></p>
            <ul id="people-list" class="people-list"></ul>
        </section>

        <section class="card">
            <h2>Expenses</h2>
            <p id="expense-hint" class="hint">Add at least 2 people to start.</p>

            <form id="expense-form" novalidate hidden>
                <div class="field">
                    <label for="expense-description">What was it for?</label>
                    <input type="text" id="expense-description" maxlength="40" autocomplete="off">
                </div>

                <div class="field">
                    <label for="expense-amount">Amount (CAD)</label>
                    <input type="number" id="expense-amount" min="0.01" step="0.01" inputmode="decimal">
                </div>

                <div class="field">
                    <label for="expense-paid-by">Who paid?</label>
                    <select id="expense-paid-by"></select>
                </div>

                <fieldset class="field">
                    <legend>Who shares it?</legend>
                    <div id="expense-shared-by"></div>
                </fieldset>

                <button type="submit">Add expense</button>
            </form>

            <p id="expense-error" class="error" role="alert"></p>
            <ul id="expense-list" class="expense-list"></ul>
        </section>

        <section class="card">
            <h2>Who owes whom</h2>
            <p id="debts-hint" class="hint">Add an expense to see the debts.</p>
            <div id="debt-groups"></div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
