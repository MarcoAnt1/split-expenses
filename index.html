<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Expenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Split Expenses</h1>
        <p id="status-message">Javascript is not connected yet.</p>

        <form id="person-form">
            <label for="person-name">Name</label>
            <div class="form-row">
                <input type="text" id="person-name" maxlength="20" autocomplete="off">
                <button type="submit">Add</button>
            </div>

            <p id="person-error" class="error" role="alert"></p>
            <ul id="people-list" class="people-list"></ul>
        </form>

    </main>

    <script src="app.js"></script>
</body>
</html>
